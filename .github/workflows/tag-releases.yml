name: tag-releases

# Creates a `<plugin>--v<version>` tag and a matching GitHub release for
# every plugin version on main that does not have one yet. Runs on every
# push to main; tags and releases that already exist are skipped, so
# reruns are no-ops and missing releases for older tags are backfilled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-releases
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            tag="${name}--v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "exists:  $tag"
            else
              git tag -a "$tag" -m "$name $version"
              git push origin "refs/tags/$tag"
              echo "created: $tag"
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "exists:  release $tag"
              continue
            fi
            # Notes: commits that touched this plugin since its previous tag.
            git fetch --quiet --tags origin
            prev=$(git tag --list "${name}--v*" --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
            range="${prev:+$prev..}$tag"
            notes=$(git log --no-merges --format='- %s (%h)' "$range" -- "plugins/$name")
            gh release create "$tag" --verify-tag --latest=false \
              --title "$name $version" \
              --notes "${notes:-Initial release.}"
            echo "created: release $tag"
          done
